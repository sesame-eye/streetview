<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Street View VR">
  <title>Street View 360 VR (Tile Distortion Fixed)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
    }
    .ui-panel {
      position: absolute;
      top: 15px; left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      width: 90%; max-width: 420px;
      background: rgba(0, 0, 0, 0.85);
      padding: 15px; border-radius: 12px;
      color: #fff; text-align: center;
      border: 1px solid #444;
      box-sizing: border-box;
      max-height: 90vh;
      overflow-y: auto;
    }
    h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
    label { display: block; text-align: left; font-size: 0.8rem; color: #ccc; margin-top: 8px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 8px; border-radius: 6px;
      border: 1px solid #555; background: #222; color: #fff;
      box-sizing: border-box; font-size: 0.9rem;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 6px;
      cursor: pointer;
    }
    .checkbox-label input {
      width: auto;
      margin: 0;
    }
    .search-box {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .search-box input {
      flex: 1;
    }
    .search-box button {
      width: auto;
      padding: 0 14px;
      margin-top: 0;
      background: #28a745;
      white-space: nowrap;
    }
    button {
      width: 100%; padding: 12px; margin-top: 10px;
      border-radius: 8px; border: none; background: #007aff;
      color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer;
    }
    button:disabled { background: #555; cursor: not-allowed; }
    #status { font-size: 0.85rem; margin-top: 10px; color: #ffcc00; word-break: break-all; }

    .round-btn {
      position: absolute; top: 15px; z-index: 1001;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.65); color: #fff;
      border: 1px solid #666; font-size: 1.1rem; line-height: 1;
      padding: 0; margin: 0; cursor: pointer;
    }
    #btn-toggle-ui { right: 15px; }
    #btn-map { right: 65px; }

    #map-overlay {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9); z-index: 2000; display: none;
    }
    #map { width: 100%; height: 100%; }
    #map-close {
      position: absolute; top: 15px; right: 15px; z-index: 2001;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(0,0,0,0.75); color: #fff; border: 1px solid #666;
      font-size: 1.1rem;
    }
    #map-hint {
      position: absolute; top: 15px; left: 15px; z-index: 2001;
      background: rgba(0,0,0,0.75); color: #fff;
      padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; max-width: 60%;
    }

    .reticle-container {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh; pointer-events: none;
      z-index: 500; display: flex;
    }
    .reticle-eye {
      width: 50vw; height: 100vh; display: flex;
      align-items: center; justify-content: center;
    }
    .reticle-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.6);
    }
  </style>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    let scene, cameraLeft, cameraRight, cameraRig, renderer, sphereMesh;
    const eyeGap = 0.5;

    let statusEl, btnLoad, btnGyro, inputApiKey, chkSaveApiKey, inputSearch, btnSearch, inputLat, inputLng, inputZoom;
    let uiPanel, btnToggleUi, btnMap, mapOverlay, mapCloseBtn;
    let uiVisible = true;

    let arrowGroup = null;
    let arrowHitBoxes = [];
    let hoveredArrow = null;
    const raycaster = new THREE.Raycaster();

    const zee = new THREE.Vector3(0, 0, 1);
    const eulerTmp = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
    let screenOrientAngle = 0;

    let currentLinks = [];
    let currentCenterHeading = 0;
    let isMoving = false;
    let svService = null;
    let geocoder = null;
    let googleMapsLoaded = false;
    let mapInited = false;
    let gMap = null;

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      const aspect = (window.innerWidth / 2) / window.innerHeight;

      cameraRig = new THREE.Group();
      scene.add(cameraRig);

      cameraLeft = new THREE.PerspectiveCamera(75, aspect, 0.1, 2000);
      cameraRight = new THREE.PerspectiveCamera(75, aspect, 0.1, 2000);

      cameraLeft.position.set(-eyeGap, 0, 0);
      cameraRight.position.set(eyeGap, 0, 0);

      cameraRig.add(cameraLeft);
      cameraRig.add(cameraRight);

      arrowGroup = new THREE.Group();
      scene.add(arrowGroup);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setScissorTest(true);
      container.appendChild(renderer.domElement);

      const light = new THREE.AmbientLight(0xffffff, 2.0);
      scene.add(light);

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('pointerdown', onTapScreen);

      animate();
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const aspect = (width / 2) / height;

      cameraLeft.aspect = aspect;
      cameraLeft.updateProjectionMatrix();

      cameraRight.aspect = aspect;
      cameraRight.updateProjectionMatrix();

      renderer.setSize(width, height);
    }

    function animate() {
      requestAnimationFrame(animate);
      checkRaycast();

      const w = window.innerWidth;
      const h = window.innerHeight;

      renderer.setViewport(0, 0, w / 2, h);
      renderer.setScissor(0, 0, w / 2, h);
      renderer.render(scene, cameraLeft);

      renderer.setViewport(w / 2, 0, w / 2, h);
      renderer.setScissor(w / 2, 0, w / 2, h);
      renderer.render(scene, cameraRight);
    }

    function build3DArrows() {
      while (arrowGroup.children.length > 0) {
        const child = arrowGroup.children[0];
        arrowGroup.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      }
      arrowHitBoxes = [];
      hoveredArrow = null;

      if (!currentLinks || currentLinks.length === 0) return;

      currentLinks.forEach(link => {
        const rad = THREE.MathUtils.degToRad(link.heading);
        const distance = 12;

        const geometry = new THREE.RingGeometry(1.2, 2.0, 32);
        const material = new THREE.MeshBasicMaterial({
          color: 0xcccccc, side: THREE.DoubleSide, transparent: true, opacity: 0.8
        });

        const ringMesh = new THREE.Mesh(geometry, material);
        ringMesh.position.set(Math.sin(rad) * distance, -4, -Math.cos(rad) * distance);
        ringMesh.rotation.x = -Math.PI / 2;

        const hitGeo = new THREE.SphereGeometry(2.5, 16, 16);
        const hitMat = new THREE.MeshBasicMaterial({ visible: false });
        const hitMesh = new THREE.Mesh(hitGeo, hitMat);
        hitMesh.position.copy(ringMesh.position);

        hitMesh.userData = { ringMesh, panoLink: link };

        arrowGroup.add(ringMesh);
        arrowGroup.add(hitMesh);
        arrowHitBoxes.push(hitMesh);
      });
    }

    function checkRaycast() {
      if (arrowHitBoxes.length === 0 || isMoving) return;

      const rayOrigin = new THREE.Vector3();
      const rayDir = new THREE.Vector3();

      cameraLeft.getWorldPosition(rayOrigin);
      cameraLeft.getWorldDirection(rayDir);

      raycaster.set(rayOrigin, rayDir);

      const intersects = raycaster.intersectObjects(arrowHitBoxes);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        if (hoveredArrow !== hit) {
          if (hoveredArrow) {
            hoveredArrow.userData.ringMesh.material.color.setHex(0xcccccc);
            hoveredArrow.userData.ringMesh.material.opacity = 0.8;
          }
          hoveredArrow = hit;
          hoveredArrow.userData.ringMesh.material.color.setHex(0x00e5ff);
          hoveredArrow.userData.ringMesh.material.opacity = 1.0;
        }
      } else {
        if (hoveredArrow) {
          hoveredArrow.userData.ringMesh.material.color.setHex(0xcccccc);
          hoveredArrow.userData.ringMesh.material.opacity = 0.8;
          hoveredArrow = null;
        }
      }
    }

    function applyTextureToSphere(textureData, tilesInfo) {
      const texture = textureData.texture || textureData;

      if (sphereMesh) {
        scene.remove(sphereMesh);
        sphereMesh.geometry.dispose();
        sphereMesh.material.dispose();
      }

      let cropRatioX = 1.0;
      if (tilesInfo && tilesInfo.worldSize && tilesInfo.tileSize) {
        const worldWidth = tilesInfo.worldSize.width;
        const worldHeight = tilesInfo.worldSize.height;
        const expectedWidth = worldHeight * 2;
        if (worldWidth > 0 && expectedWidth > 0) {
          cropRatioX = Math.min(worldWidth / expectedWidth, 1.0);
        }
      } else if (textureData.validRatio) {
        cropRatioX = textureData.validRatio;
      }

      texture.repeat.set(cropRatioX, 1);

      const geometry = new THREE.SphereGeometry(1000, 60, 40);
      geometry.scale(-1, 1, 1);

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
      });

      sphereMesh = new THREE.Mesh(geometry, material);
      const centerHeadingRad = THREE.MathUtils.degToRad(currentCenterHeading);
      sphereMesh.rotation.y = -Math.PI / 2 - centerHeadingRad;

      scene.add(sphereMesh);
    }

    /* タイル取得・連結ロジック（欠損・ラッピング対応版） */
    async function fetchAndStitchTiles(panoId, zoom, apiKey) {
      const sessionRes = await fetch(`https://tile.googleapis.com/v1/createSession?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mapType: 'streetview', language: 'ja-JP', region: 'JP' })
      });
      if (!sessionRes.ok) throw new Error("SessionTokenの取得に失敗しました");
      const sessionData = await sessionRes.json();
      const sessionToken = sessionData.session;

      const tileWidth = 512;
      const tileHeight = 512;
      const cols = Math.pow(2, zoom);
      const rows = Math.pow(2, Math.max(zoom - 1, 0));

      const gridWidth = cols * tileWidth;
      const gridHeight = rows * tileHeight;

      const canvas = document.createElement('canvas');
      canvas.width = gridWidth;
      canvas.height = gridHeight;
      const ctx = canvas.getContext('2d');

      const promises = [];
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const tileUrl = `https://tile.googleapis.com/v1/streetview/tiles/${zoom}/${x}/${y}?session=${sessionToken}&panoId=${panoId}&key=${apiKey}`;
          const p = new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
              ctx.drawImage(img, x * tileWidth, y * tileHeight);
              resolve();
            };
            img.onerror = () => {
              // 404等の欠損タイル発生時も落とさずスキップ
              resolve();
            };
            img.src = tileUrl;
          });
          promises.push(p);
        }
      }

      await Promise.all(promises);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      
      // シーム（継ぎ目）で画像が引き伸ばされるのを防ぐため RepeatWrapping を使用
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;

      texture.needsUpdate = true;
      return { texture, validRatio: 1.0 };
    }

    function geocodeAddress() {
      const apiKey = inputApiKey.value.trim();
      const query = inputSearch.value.trim();

      if (!apiKey) {
        alert("APIキーを入力してください");
        return;
      }
      if (!query) {
        alert("検索したいキーワードを入力してください");
        return;
      }

      statusEl.textContent = "キーワードを検索中...";

      loadGoogleMapsScript(apiKey, () => {
        if (!geocoder) geocoder = new google.maps.Geocoder();

        geocoder.geocode({ address: query }, (results, status) => {
          if (status === 'OK' && results[0]) {
            const loc = results[0].geometry.location;
            inputLat.value = loc.lat();
            inputLng.value = loc.lng();
            statusEl.textContent = `「${results[0].formatted_address}」の地図を開きました。タップで場所を選択してください。`;

            openMapWithLocation(loc.lat(), loc.lng(), 18);
          } else {
            statusEl.textContent = "検索エラー: 該当する場所が見つかりませんでした";
          }
        });
      });
    }

    async function loadPanorama() {
      const apiKey = inputApiKey.value.trim();
      const lat = inputLat.value.trim();
      const lng = inputLng.value.trim();

      if (!apiKey) {
        alert("APIキーを入力してください");
        return;
      }

      if (chkSaveApiKey.checked) {
        localStorage.setItem('sv_vr_api_key', apiKey);
      } else {
        localStorage.removeItem('sv_vr_api_key');
      }

      statusEl.textContent = "0. 地点を解決中...";
      btnLoad.disabled = true;
      btnGyro.style.display = "none";
      currentLinks = [];
      build3DArrows();

      try {
        const metaRes = await fetch(`https://maps.googleapis.com/maps/api/streetview/metadata?location=${lat},${lng}&key=${apiKey}`);
        const metaData = await metaRes.json();

        if (metaData.status !== 'OK' || !metaData.pano_id) {
          throw new Error("指定座標のパノラマが見つかりませんでした");
        }

        if (metaData.location) {
          inputLat.value = metaData.location.lat;
          inputLng.value = metaData.location.lng;
        }

        loadPanoramaByPanoId(metaData.pano_id, true);
      } catch (err) {
        console.error(err);
        statusEl.textContent = "エラー: " + err.message;
        btnLoad.disabled = false;
      }
    }

    async function loadPanoramaByPanoId(panoId, isInitial) {
      if (!isInitial && isMoving) return;
      if (!isInitial) isMoving = true;

      const apiKey = inputApiKey.value.trim();
      const zoom = parseInt(inputZoom.value.trim()) || 2;

      statusEl.textContent = isInitial ? "1. パノラマ画像を生成中..." : "移動中...";

      try {
        const textureData = await fetchAndStitchTiles(panoId, zoom, apiKey);

        ensureStreetViewService(apiKey, () => {
          svService.getPanorama({ pano: panoId }, (data, status) => {
            let tilesInfo = null;
            if (status === 'OK') {
              currentLinks = data.links || [];
              tilesInfo = data.tiles || null;
              currentCenterHeading = (data.tiles && typeof data.tiles.centerHeading === 'number')
                ? data.tiles.centerHeading : 0;
            } else {
              currentLinks = [];
              currentCenterHeading = 0;
            }

            applyTextureToSphere(textureData, tilesInfo);
            build3DArrows();

            statusEl.textContent = isInitial ? "360度 VR準備完了！" : "移動完了";
            if (isInitial) {
              btnGyro.style.display = "block";
              btnLoad.disabled = false;
            } else {
              isMoving = false;
            }
          });
        });
      } catch (err) {
        console.error(err);
        statusEl.textContent = "画像の取得に失敗しました: " + err.message;
        if (isInitial) btnLoad.disabled = false;
        else isMoving = false;
      }
    }

    function loadGoogleMapsScript(apiKey, callback) {
      if (googleMapsLoaded && window.google && window.google.maps) {
        callback();
        return;
      }
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}`;
      script.onload = () => {
        googleMapsLoaded = true;
        callback();
      };
      script.onerror = () => {
        statusEl.textContent = 'Google Maps JS SDK の読み込みに失敗しました';
      };
      document.head.appendChild(script);
    }

    function ensureStreetViewService(apiKey, callback) {
      loadGoogleMapsScript(apiKey, () => {
        if (!svService) svService = new google.maps.StreetViewService();
        callback();
      });
    }

    function initMap(initialLat, initialLng, initialZoom) {
      const lat = initialLat || parseFloat(inputLat.value) || 35.681236;
      const lng = initialLng || parseFloat(inputLng.value) || 139.767125;
      const zoom = initialZoom || 3;

      if (!mapInited) {
        mapInited = true;
        gMap = new google.maps.Map(document.getElementById('map'), {
          center: { lat, lng },
          zoom: zoom,
          streetViewControl: false,
        });

        gMap.addListener('click', (e) => {
          inputLat.value = e.latLng.lat();
          inputLng.value = e.latLng.lng();
          mapOverlay.style.display = 'none';
          loadPanorama();
        });
      } else {
        gMap.setCenter({ lat, lng });
        gMap.setZoom(zoom);
      }
    }

    function openMapWithLocation(lat, lng, zoom) {
      const apiKey = inputApiKey.value.trim();
      if (!apiKey) {
        alert('APIキーを入力してください');
        return;
      }
      mapOverlay.style.display = 'block';
      loadGoogleMapsScript(apiKey, () => {
        initMap(lat, lng, zoom);
      });
    }

    function openMap() {
      openMapWithLocation(null, null, 3);
    }

    function updateScreenOrientAngle() {
      if (screen.orientation && typeof screen.orientation.angle === 'number') {
        screenOrientAngle = screen.orientation.angle;
      } else {
        screenOrientAngle = window.orientation || 0;
      }
    }

    function setCameraQuaternionFromDeviceOrientation(alphaDeg, betaDeg, gammaDeg) {
      const alpha = THREE.MathUtils.degToRad(alphaDeg);
      const beta  = THREE.MathUtils.degToRad(betaDeg);
      const gamma = THREE.MathUtils.degToRad(gammaDeg);
      const orient = THREE.MathUtils.degToRad(screenOrientAngle);

      eulerTmp.set(beta, alpha, -gamma, 'YXZ');
      cameraRig.quaternion.setFromEuler(eulerTmp);
      cameraRig.quaternion.multiply(q1);
      cameraRig.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
    }

    function enableGyro() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then((p) => {
            if (p === 'granted') bindGyroEvents();
            else alert('ジャイロ操作へのアクセスが許可されませんでした');
          })
          .catch(console.error);
      } else {
        bindGyroEvents();
      }
    }

    function bindGyroEvents() {
      updateScreenOrientAngle();
      window.addEventListener('orientationchange', updateScreenOrientAngle);

      window.addEventListener('deviceorientation', (e) => {
        if (e.alpha === null) return;
        setCameraQuaternionFromDeviceOrientation(e.alpha || 0, e.beta || 0, e.gamma || 0);
      });

      btnGyro.textContent = "ジャイロ連動中（青リングを合わせてタップ）";
      btnGyro.style.background = "#28a745";
    }

    function onTapScreen(e) {
      if (e.target.closest('.ui-panel') || e.target.closest('.round-btn') || e.target.closest('#map-overlay')) {
        return;
      }

      if (hoveredArrow && hoveredArrow.userData && hoveredArrow.userData.panoLink) {
        const nextPano = hoveredArrow.userData.panoLink.pano;
        loadPanoramaByPanoId(nextPano, false);
      }
    }

    function toggleUi() {
      uiVisible = !uiVisible;
      uiPanel.style.display = uiVisible ? 'block' : 'none';
      btnToggleUi.textContent = uiVisible ? '✕' : '☰';
    }

    window.addEventListener('DOMContentLoaded', () => {
      statusEl = document.getElementById('status');
      btnLoad = document.getElementById('btn-load');
      btnGyro = document.getElementById('btn-gyro');
      inputApiKey = document.getElementById('input-apikey');
      chkSaveApiKey = document.getElementById('chk-save-apikey');
      inputSearch = document.getElementById('input-search');
      btnSearch = document.getElementById('btn-search');
      inputLat = document.getElementById('input-lat');
      inputLng = document.getElementById('input-lng');
      inputZoom = document.getElementById('input-zoom');
      uiPanel = document.getElementById('ui-panel');
      btnToggleUi = document.getElementById('btn-toggle-ui');
      btnMap = document.getElementById('btn-map');
      mapOverlay = document.getElementById('map-overlay');
      mapCloseBtn = document.getElementById('map-close');

      const savedApiKey = localStorage.getItem('sv_vr_api_key');
      if (savedApiKey) {
        inputApiKey.value = savedApiKey;
        chkSaveApiKey.checked = true;
      }

      btnLoad.addEventListener('click', loadPanorama);
      btnSearch.addEventListener('click', geocodeAddress);
      inputSearch.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') geocodeAddress();
      });
      btnGyro.addEventListener('click', enableGyro);
      btnToggleUi.addEventListener('click', toggleUi);
      btnMap.addEventListener('click', openMap);
      mapCloseBtn.addEventListener('click', () => { mapOverlay.style.display = 'none'; });

      initThree();
      statusEl.textContent = savedApiKey ? "保存されたキーを読み込みました。「360 VR生成」を押してください" : "APIキーを入力して「360 VR生成」を押してください";
    });
  </script>
</head>
<body>

  <button id="btn-toggle-ui" class="round-btn" title="UIの表示/非表示">✕</button>
  <button id="btn-map" class="round-btn" title="世界地図から選ぶ">🌍</button>

  <div class="ui-panel" id="ui-panel">
    <h3>Street View 360 VR</h3>

    <label for="input-apikey">Google Maps API Key</label>
    <input id="input-apikey" type="password" placeholder="AIzaSy..." />
    <label class="checkbox-label">
      <input type="checkbox" id="chk-save-apikey" />
      APIキーをこの端末に保存する
    </label>

    <label for="input-search">キーワード検索 (地名・施設名)</label>
    <div class="search-box">
      <input id="input-search" type="text" placeholder="例: エッフェル塔, サグラダファミリア" />
      <button id="btn-search">検索</button>
    </div>

    <label for="input-lat">緯度 (lat)</label>
    <input id="input-lat" type="text" value="35.681236" />

    <label for="input-lng">経度 (lng)</label>
    <input id="input-lng" type="text" value="139.767125" />

    <label for="input-zoom">zoom (0〜3程度推奨)</label>
    <input id="input-zoom" type="text" value="2" />

    <button id="btn-load">1. 360 VR生成</button>
